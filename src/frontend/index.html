<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>All Around the World</title>
    <meta name="description" content="Spin the globe, tap any of 250 countries for capitals, facts, live news and Wikipedia." />
    <link rel="canonical" href="https://worldfly.vercel.app/" />

    <!-- Link previews (Open Graph: WhatsApp, Slack, LinkedIn, Facebook, iMessage, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="All Around the World" />
    <meta property="og:title" content="All Around the World — interactive globe" />
    <meta property="og:description" content="Spin the globe, tap any of 250 countries for capitals, facts, live news and Wikipedia." />
    <meta property="og:url" content="https://worldfly.vercel.app/" />
    <meta property="og:image" content="https://worldfly.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="3D globe with countries coloured by region next to the title All Around the World" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="All Around the World — interactive globe" />
    <meta name="twitter:description" content="Spin the globe, tap any of 250 countries for capitals, facts, live news and Wikipedia." />
    <meta name="twitter:image" content="https://worldfly.vercel.app/og.jpg" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffd166' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20'/><path d='M2 12h20'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="globe" aria-label="Interactive globe"></div>

    <header class="topbar">
      <div class="search">
        <button id="search-toggle" class="icon-btn" title="Search (/)" aria-label="Search countries" aria-expanded="false" aria-controls="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        </button>
        <input id="search" type="search" placeholder="Country or capital" tabindex="-1" autocomplete="off" enterkeyhint="go" aria-label="Search countries or capitals" />
        <ul id="results" role="listbox" hidden></ul>
      </div>
      <button id="random" class="icon-btn" title="Random country" aria-label="Random country">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5" /><path d="M4 20 21 3" /><path d="M21 16v5h-5" /><path d="m15 15 6 6" /><path d="M4 4l5 5" /></svg>
      </button>
      <div class="theme-wrap">
        <button id="theme-btn" class="icon-btn" title="Globe theme" aria-label="Globe theme" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" /><circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /><circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /><circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /><circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /></svg>
        </button>
        <div id="theme-menu" role="menu" aria-label="Globe theme" hidden></div>
      </div>
    </header>

    <div id="loading">Loading the world…</div>

    <section id="sheet" hidden>
      <div class="handle" id="handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <nav class="tabs" id="tabs" role="tablist" aria-label="Country views"></nav>
        <button id="close" class="icon-btn close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>
      <div id="sheet-body" role="tabpanel" aria-live="polite"></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
